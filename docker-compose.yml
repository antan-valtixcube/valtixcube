version: '3'
services:
  valtixcube:
    restart: always
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: valtixcube
    ports:
      - "3001:3000"                       # Map port 3000 in container to port 3001 on host
    volumes:
      - .:/usr/src/dev_valtixcube            # Local files into container
    command: npm run start

  